[package]
name = "sleip-cli"
description = "Sleip, the plugin package manager for Lokyr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "sleip"
path = "src/main.rs"

[dependencies]
fluent-syntax.workspace = true
sleip-analyzer.workspace = true
sleip-index.workspace = true
sleip-resolver.workspace = true
lokyr-pkg-model = { workspace = true, features = ["archive"] }
lokyr-plugin-sdk.workspace = true
# The host of a plugin's own tests, of the SDK's fake host.
lokyr-plugin-host-luau = { workspace = true, features = ["test-host"] }
semver.workspace = true
serde_json.workspace = true
# `sleip dev`'s end, as the user interrupts it.
signal-hook.workspace = true
# The user's plugins.toml edited in place, of its comments and order.
toml_edit = { workspace = true, features = ["display"] }

[dev-dependencies]
lokyr-pkg-model = { workspace = true, features = ["archive"] }
lokyr-plugin-sdk = { workspace = true, features = ["fake"] }
serde_json.workspace = true

[lints]
workspace = true
