<svg xmlns="http://www.w3.org/2000/svg" class="chart" width="680" height="284" viewBox="0 0 680 284" role="img" aria-label="Latency at 120 Hz">
<style>
  .chart .surface { fill: #fcfcfb; }
  .chart .primary { fill: #0b0b0b; }
  .chart .secondary { fill: #52514e; }
  .chart .muted { fill: #898781; }
  .chart .grid { stroke: #e1e0d9; }
  .chart .base { stroke: #c3c2b7; }
  .chart .accent { fill: #2a78d6; }
  .chart .context { fill: #898781; }
  .chart .accent-line { stroke: #2a78d6; }
  .chart .context-line { stroke: #898781; }
  .chart .second { fill: #eb6834; }
  .chart .second-line { stroke: #eb6834; }
  .chart .ring { stroke: #fcfcfb; }
  .chart .budget { stroke: #52514e; }
  .chart .column.on { fill: #2a78d6; fill-opacity: 0.08; }
  .chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .chart .tick { font-variant-numeric: tabular-nums; }
  .chart .column { fill: transparent; }
  .chart.hide-0 .s0, .chart.hide-1 .s1 { display: none; }
  .chart.hide-0 .legend-item[data-series="0"], .chart.hide-1 .legend-item[data-series="1"] { opacity: 0.4; }
  @media (prefers-color-scheme: dark) {
    .chart .surface { fill: #1a1a19; }
    .chart .primary { fill: #f0efec; }
    .chart .secondary { fill: #c3c2b7; }
    .chart .muted { fill: #898781; }
    .chart .grid { stroke: #2c2c2a; }
    .chart .base { stroke: #383835; }
    .chart .accent { fill: #3987e5; }
    .chart .context { fill: #6f6e69; }
    .chart .accent-line { stroke: #3987e5; }
    .chart .context-line { stroke: #6f6e69; }
    .chart .second { fill: #d95926; }
    .chart .second-line { stroke: #d95926; }
    .chart .ring { stroke: #1a1a19; }
    .chart .budget { stroke: #c3c2b7; }
    .chart .column.on { fill: #3987e5; fill-opacity: 0.16; }
  }
  .chart.dark .surface { fill: #1a1a19; }
  .chart.dark .primary { fill: #f0efec; }
  .chart.dark .secondary { fill: #c3c2b7; }
  .chart.dark .muted { fill: #898781; }
  .chart.dark .grid { stroke: #2c2c2a; }
  .chart.dark .base { stroke: #383835; }
  .chart.dark .accent { fill: #3987e5; }
  .chart.dark .context { fill: #6f6e69; }
  .chart.dark .accent-line { stroke: #3987e5; }
  .chart.dark .context-line { stroke: #6f6e69; }
  .chart.dark .second { fill: #d95926; }
  .chart.dark .second-line { stroke: #d95926; }
  .chart.dark .ring { stroke: #1a1a19; }
  .chart.dark .budget { stroke: #c3c2b7; }
  .chart.dark .column.on { fill: #3987e5; fill-opacity: 0.16; }
</style>
