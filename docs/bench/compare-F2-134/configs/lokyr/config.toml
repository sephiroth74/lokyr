# Lokyr under F2-134's conditions: Menlo 13, 120 × 40 cells, no ligatures,
# a steady cursor, an opaque window, about 10 000 rows of scrollback.
[font]
family = "Menlo"
size = 13
ligatures = false

[cursor]
blink = false

[window]
columns = 120
rows = 40
remember-frame = false
background-opacity = 1

[scrollback]
limit = 10
