<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img" aria-label="Latency at 60 Hz">

<style>
  .surface { fill: #fcfcfb; }
  .primary { fill: #0b0b0b; }
  .secondary { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; }
  .base { stroke: #c3c2b7; }
  .accent { fill: #2a78d6; }
  .context { fill: #898781; }
  .accent-line { stroke: #2a78d6; }
  .context-line { stroke: #898781; }
  .second { fill: #eb6834; }
  .second-line { stroke: #eb6834; }
  .ring { stroke: #fcfcfb; }
  .budget { stroke: #52514e; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .primary { fill: #f0efec; }
    .secondary { fill: #c3c2b7; }
    .muted { fill: #898781; }
    .grid { stroke: #2c2c2a; }
    .base { stroke: #383835; }
    .accent { fill: #3987e5; }
    .context { fill: #6f6e69; }
    .accent-line { stroke: #3987e5; }
    .context-line { stroke: #6f6e69; }
    .second { fill: #d95926; }
    .second-line { stroke: #d95926; }
    .ring { stroke: #1a1a19; }
    .budget { stroke: #c3c2b7; }
  }
</style>

<rect class="surface" width="680" height="322" rx="8"/>
<text class="primary" x="16" y="26" font-size="15" font-weight="600">Latency at 60 Hz</text>
<text class="secondary" x="16" y="45" font-size="12">A key to its echo on screen, in ms, of 200 keys of Typometer&#x27;s, the window alone; less is better; every</text>
<text class="secondary" x="16" y="61" font-size="12">terminal measured on 1 November 2026</text>
<circle class="context" cx="22" cy="80" r="5"/>
