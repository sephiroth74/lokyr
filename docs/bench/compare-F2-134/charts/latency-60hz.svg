<line class="context-line" x1="321.6" y1="263.2" x2="515.6" y2="263.2" stroke-width="2" stroke-linecap="round"/>
<circle class="context ring" cx="321.6" cy="263.2" r="5" stroke-width="2"><title>Ghostty, median: 33.1 ms</title></circle>
