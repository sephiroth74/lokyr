<text class="muted tick" x="241.0" y="297.0" font-size="11" text-anchor="middle">20</text>
<line class="grid" x1="364.0" y1="94" x2="364.0" y2="282.0" stroke-width="1"/>
<text class="muted tick" x="364.0" y="297.0" font-size="11" text-anchor="middle">40</text>
<line class="grid" x1="487.0" y1="94" x2="487.0" y2="282.0" stroke-width="1"/>
<text class="muted tick" x="487.0" y="297.0" font-size="11" text-anchor="middle">60</text>
<line class="grid" x1="610.0" y1="94" x2="610.0" y2="282.0" stroke-width="1"/>
<text class="muted tick" x="610.0" y="297.0" font-size="11" text-anchor="middle">80</text>
<line class="base" x1="118" y1="94" x2="118" y2="282.0" stroke-width="1"/>
<text class="secondary" x="108" y="116.8" font-size="12" text-anchor="end">Alacritty</text>
<line class="context-line" x1="248.2" y1="112.8" x2="412.6" y2="112.8" stroke-width="2" stroke-linecap="round"/>
<circle class="context ring" cx="248.2" cy="112.8" r="5" stroke-width="2"><title>Alacritty, median: 21.2 ms</title></circle>
<circle class="surface context-line" cx="412.6" cy="112.8" r="4.5" stroke-width="2"><title>Alacritty, 99th percentile: 47.9 ms</title></circle>
