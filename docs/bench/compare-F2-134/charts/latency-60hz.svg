<circle class="surface context-line" cx="428.8" cy="188.0" r="4.5" stroke-width="2"><title>kitty, 99th percentile: 50.5 ms</title></circle>
<text class="secondary tick" x="304.5" y="192.0" font-size="12" text-anchor="end">32.0</text>
<text class="secondary tick" x="438.8" y="192.0" font-size="12">50.5</text>
<text class="secondary" x="108" y="229.6" font-size="12" text-anchor="end">iTerm2</text>
<line class="context-line" x1="338.0" y1="225.6" x2="429.3" y2="225.6" stroke-width="2" stroke-linecap="round"/>
<circle class="context ring" cx="338.0" cy="225.6" r="5" stroke-width="2"><title>iTerm2, median: 35.8 ms</title></circle>
