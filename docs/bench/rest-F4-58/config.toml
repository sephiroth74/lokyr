# The session of F4-58, as F4-25's A/B and F3-77's: F2-134's conditions, Menlo 13,
# 120 × 40 cells, no ligatures, an opaque window, about 10 000 rows of
# scrollback; the cursor blinks, as by default, and stops 15 s after the
# last key or output.
[font]
family = "Menlo"
size = 13
ligatures = false

[window]
columns = 120
rows = 40
remember-frame = false
background-opacity = 1

[scrollback]
limit = 10
