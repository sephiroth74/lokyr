<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" role="img" aria-label="Latency at 60 Hz">

<style>
  .surface { fill: #fcfcfb; }
  .primary { fill: #0b0b0b; }
  .secondary { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; }
  .base { stroke: #c3c2b7; }
  .accent { fill: #2a78d6; }
  .context { fill: #898781; }
  .accent-line { stroke: #2a78d6; }
  .context-line { stroke: #898781; }
  .second { fill: #eb6834; }
  .second-line { stroke: #eb6834; }
  .ring { stroke: #fcfcfb; }
  .budget { stroke: #52514e; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .primary { fill: #f0efec; }
    .secondary { fill: #c3c2b7; }
    .muted { fill: #898781; }
    .grid { stroke: #2c2c2a; }
    .base { stroke: #383835; }
    .accent { fill: #3987e5; }
    .context { fill: #6f6e69; }
