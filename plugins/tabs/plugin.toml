# The manifest of the built-in plugin of the tabs.
[plugin]
name = "lokyr/tabs"
kind = "builtin"
license = "MIT"
description = "The tab bar and the tabs' commands: new, close, select, move, rename, color and out to a window of their own"

[capabilities]
process-read = true
workspace-write = true
pane-view = true

[contributes]
slots = ["tab-bar"]
config-schema = "tabs.schema.json"
