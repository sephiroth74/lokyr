# The manifest of the built-in plugin of the search.
[plugin]
name = "lokyr/search"
kind = "builtin"
license = "MIT"
description = "The find bar: a pane's search, of its history, its case, regexes and whole words, its matches counted and stepped through"

[capabilities]
terminal-read = true
pane-view = true
decorate = true

[contributes]
config-schema = "search.schema.json"
