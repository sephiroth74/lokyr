# The manifest of the built-in plugin of the splits.
[plugin]
name = "lokyr/splits"
kind = "builtin"
license = "MIT"
description = "The panes' commands: split, focus by direction, next and previous, resize, zoom, equalize, swap, and out to a tab or a window"

[contributes]
slots = ["pane-header"]
config-schema = "splits.schema.json"
