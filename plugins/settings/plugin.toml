# The manifest of the built-in plugin of the settings' page.
[plugin]
name = "lokyr/settings"
kind = "builtin"
license = "MIT"
description = "The settings window's first page: every key of the config and of the plugins' sections, of its text, its platforms and a control of its value, written into the config file"

[activation]
on = ["page:settings", "page:themes"]

[capabilities]
config = true
open = true
# A font's family or style shown in the panes as its menu's item is
# highlighted.
appearance-write = true

# A theme's card's Duplicate…, a new theme that the app makes.
[uses]
commands = ["app.new-theme"]

[contributes]
pages = [{ id = "settings", icon = "settings" }, { id = "themes", icon = "symbol-color" }]
