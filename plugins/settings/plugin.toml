# The manifest of the built-in plugin of the settings' page.
[plugin]
name = "lokyr/settings"
kind = "builtin"
license = "MIT"
description = "The settings window's first pages: every key of the config and of the plugins' sections, of its text, its platforms and a control of its value, written into the config file; the bindings of keys; the themes, and the Theme Editor of every token"

[activation]
on = ["page:settings", "page:keys", "page:themes"]

[capabilities]
config = true
open = true
# The Theme Editor's line of a token, copied to paste.
clipboard-write = true
# A font's family or style shown in the panes as its menu's item is
# highlighted.
appearance-write = true

# The themes page's Import…, the themes that the app imports, and Show in
# Finder, the themes' folder that it shows.
[uses]
commands = ["app.import-themes", "app.open-themes-folder"]

[contributes]
pages = [
    { id = "settings", icon = "settings" },
    { id = "keys", icon = "keyboard" },
    { id = "themes", icon = "symbol-color" },
]
