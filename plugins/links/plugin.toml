# The manifest of the built-in plugin that opens links with ⌘-click.
[plugin]
name = "lokyr/links"
kind = "builtin"
license = "MIT"
description = "Opens the link, the URL or the path under a ⌘-click"

[capabilities]
terminal-read = true
open = true
process-read = true
clipboard-write = true

[contributes]
commands = [
    { name = "links.open", title = "Open Link" },
    { name = "links.copy", title = "Copy Link Address" },
    { name = "links.new-window", title = "New Window at Folder" },
    { name = "links.new-tab", title = "New Tab at Folder" },
]
