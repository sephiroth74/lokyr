# The manifest of the built-in plugin that opens links with ⌘-click.
[plugin]
name = "lokyr/links"
kind = "builtin"
license = "MIT"
description = "Opens the link, the URL or the path under a ⌘-click"

[capabilities]
terminal-read = true
open = true
process-read = true
clipboard-write = true
workspace-write = true
decorate = true
pane-view = true
pty-write = true
pointer-read = true

[contributes]
config-schema = "links.schema.json"
commands = [
    { name = "links.open", title = "Open Link" },
    { name = "links.copy", title = "Copy Link Address" },
    { name = "links.new-window", title = "New Window at Folder" },
    { name = "links.new-tab", title = "New Tab at Folder" },
    { name = "links.hints", title = "Show Hints" },
    { name = "links.hints-action", title = "Next Hint Action" },
]
