# The manifest of the built-in plugin of the commands' blocks.
[plugin]
name = "lokyr/blocks"
kind = "builtin"
license = "MIT"
description = "Each command and its output a block: the command's header at the pane's top while its line is above the view, which a click scrolls to, and its button to the block's end; a block's line, or its line and output, copied, the block selected, its status, times and folder shown, and its line run again"
# The plain header, which comes back while this plugin is off.
replaces = ["lokyr/command-header"]

[capabilities]
terminal-read = true
history-read = true
pane-view = true
# A block's line, or its line and output, copied.
clipboard-write = true
# A block's folder, of its details, the shell's working directory as the
# command started.
process-read = true
# A block's command line run again, typed at the shell's prompt.
pty-write = true
# A click on a block, which selects it, and a context click on the
# block's prompt rows pinned at the pane's top, which opens its menu.
pointer-read = true

# The commands of a command's output, in the pane's context menu's submenu
# of a block's actions.
[uses]
commands = ["pane.copy-output", "pane.select-output"]

[contributes]
config-schema = "blocks.schema.json"
