[package]
name = "lokyr-app-core"
description = "The Lokyr terminal's window controller, portable across platforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# The distributions, each of the first-party plugins that its build holds.
# What `cargo xtask gen-dist` writes of dist/*.toml, which it rewrites.
default = ["dist-default"]
dist-default = ["plugin-keymap-macos", "plugin-core-actions", "plugin-links", "plugin-tabs", "plugin-splits", "plugin-search", "plugin-command-palette", "plugin-quick-terminal", "plugin-progress", "plugin-command-header", "plugin-copy-mode"]
dist-minimal = ["plugin-keymap-macos", "plugin-core-actions"]
plugin-keymap-macos = ["dep:lokyr-keymap-macos"]
plugin-core-actions = ["dep:lokyr-core-actions"]
plugin-links = ["dep:lokyr-links"]
plugin-tabs = ["dep:lokyr-tabs"]
plugin-splits = ["dep:lokyr-splits"]
plugin-search = ["dep:lokyr-search-plugin"]
plugin-command-palette = ["dep:lokyr-command-palette"]
plugin-quick-terminal = ["dep:lokyr-quick-terminal"]
plugin-progress = ["dep:lokyr-progress"]
plugin-command-header = ["dep:lokyr-command-header"]
plugin-copy-mode = ["dep:lokyr-copy-mode"]
# The end of what `cargo xtask gen-dist` writes.
# A plugin of a view in every slot of the windows, for a build of tests.
sample-slots = []
# A plugin on a thread of its own that renders the status bar without pause,
# reading the focused pane, for a build of tests.
sample-worker = []

[dependencies]
accesskit.workspace = true
lokyr-kernel.workspace = true
lokyr-plugin-host-luau.workspace = true
lokyr-platform-core.workspace = true
lokyr-pty.workspace = true
lokyr-render-core.workspace = true
lokyr-text-core.workspace = true
lokyr-ui-core.workspace = true
lokyr-vt-core.workspace = true
libc.workspace = true
notify.workspace = true
# The distributions' plugins.
# What `cargo xtask gen-dist` writes of dist/*.toml, which it rewrites.
lokyr-core-actions = { workspace = true, optional = true }
lokyr-links = { workspace = true, optional = true }
lokyr-tabs = { workspace = true, optional = true }
lokyr-splits = { workspace = true, optional = true }
lokyr-search-plugin = { workspace = true, optional = true }
lokyr-command-palette = { workspace = true, optional = true }
lokyr-quick-terminal = { workspace = true, optional = true }
lokyr-progress = { workspace = true, optional = true }
lokyr-command-header = { workspace = true, optional = true }
lokyr-copy-mode = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
lokyr-keymap-macos = { workspace = true, optional = true }
# The end of what `cargo xtask gen-dist` writes.

[build-dependencies]
lokyr-pkg-model.workspace = true

[dev-dependencies]
lokyr-platform-core = { workspace = true, features = ["fake"] }
lokyr-pkg-model.workspace = true

# The Mac's default shortcuts, which the tests press on every system.
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
lokyr-keymap-macos.workspace = true

[lints]
workspace = true
