[package]
name = "lokyr-app-core"
description = "The Lokyr terminal's window controller, portable across platforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# A plugin of a view in every slot of the windows, for a build of tests.
sample-slots = []
# A plugin on a thread of its own that renders the status bar without pause,
# reading the focused pane, for a build of tests.
sample-worker = []

[dependencies]
accesskit.workspace = true
lokyr-core-actions.workspace = true
lokyr-kernel.workspace = true
lokyr-links.workspace = true
lokyr-platform-core.workspace = true
lokyr-pty.workspace = true
lokyr-render-core.workspace = true
lokyr-text-core.workspace = true
lokyr-ui-core.workspace = true
lokyr-vt-core.workspace = true
libc.workspace = true
notify.workspace = true

[build-dependencies]
lokyr-pkg-model.workspace = true

[dev-dependencies]
lokyr-platform-core = { workspace = true, features = ["fake"] }

[lints]
workspace = true
