[package]
name = "lokyr-platform-macos"
description = "macOS platform backend built on AppKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
lokyr-platform-core.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_macos.workspace = true
block2.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "objc2-uniform-type-identifiers",
    "NSAccessibility",
    "NSAlert",
    "NSAnimation",
    "NSAnimationContext",
    "NSAppearance",
    "NSApplication",
    "NSApplicationScripting",
    "NSAttributedString",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDockTile",
    "NSEvent",
    "NSFont",
    "NSFontManager",
    "NSGraphics",
    "NSGraphicsContext",
    "NSBitmapImageRep",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSDragging",
    "NSPanel",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSResponder",
    "NSSavePanel",
    "NSScreen",
    "NSScroller",
    "NSText",
    "NSTextField",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSTitlebarAccessoryViewController",
    "NSToolbar",
    "NSTrackingArea",
    "NSRunningApplication",
    "NSView",
    "NSViewController",
    "NSLayoutConstraint",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { workspace = true, features = ["std", "block2", "CFRunLoop"] }
objc2-quartz-core = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CAAnimation",
    "CABase",
    "CADisplayLink",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CAMetalLayer",
    "CAShapeLayer",
    "CATransaction",
] }
objc2-core-graphics = { workspace = true, features = [
    "std",
    "CGBitmapContext",
    "CGColor",
    "CGColorSpace",
    "CGContext",
    "CGImage",
    "CGPath",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSError",
    "NSDate",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSUserDefaults",
    "NSValue",
    "NSURL",
] }
objc2-uniform-type-identifiers = { workspace = true, features = ["std", "UTType", "UTCoreTypes"] }
objc2-user-notifications = { workspace = true, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
lokyr-platform-core = { workspace = true, features = ["conformance"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
accesskit.workspace = true
objc2-app-kit = { workspace = true, features = ["NSPasteboardItem", "NSTextView"] }
objc2-foundation = { workspace = true, features = ["NSOperation", "NSUserDefaults"] }

