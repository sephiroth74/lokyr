[package]
name = "lokyr-platform-macos"
description = "macOS platform backend built on AppKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
lokyr-platform-core.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSTextInputClient",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { workspace = true, features = ["std", "CFRunLoop"] }
objc2-quartz-core = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "CADisplayLink",
    "CALayer",
    "CAMetalLayer",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
] }

# The run loop needs the process's main thread, which the test harness keeps
# for itself.
[[test]]
name = "run_loop"
harness = false

[[test]]
name = "quit_in_modal"
harness = false

[[test]]
name = "quit_with_sheet"
harness = false

[[test]]
name = "panic_in_modal"
harness = false

[[test]]
name = "frame_requests"
harness = false

[[test]]
name = "appearance"
harness = false

[[test]]
name = "timers"
harness = false

[[test]]
name = "keys"
harness = false

[[test]]
name = "text_input"
harness = false

[[test]]
name = "input_sequences"
harness = false

[[test]]
name = "app_icon"
harness = false

[[test]]
name = "locales"
harness = false

[[test]]
name = "translucency"
harness = false

[lints]
workspace = true
