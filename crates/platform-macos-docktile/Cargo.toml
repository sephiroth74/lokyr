[package]
name = "lokyr-platform-macos-docktile"
description = "The Dock tile plug-in that keeps Lokyr's icon's variant in the Dock while the app is not running"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# A plug-in that the Dock loads, of no Rust caller.
crate-type = ["cdylib"]
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSImageView",
    "NSResponder",
    "NSView",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "NSBundle",
    "NSDistributedNotificationCenter",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSUserDefaults",
] }

[lints]
workspace = true
