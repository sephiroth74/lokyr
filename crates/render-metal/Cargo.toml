[package]
name = "bolt-render-metal"
description = "Metal renderer for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
bolt-render-core.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true, features = ["std", "block2", "objc2"] }
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGColorSpace"] }
objc2-foundation = { workspace = true, features = ["std", "NSString"] }
objc2-metal = { workspace = true, features = [
    "std",
    "dispatch2",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-quartz-core = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
    "CALayer",
    "CAMetalLayer",
] }

[lints]
workspace = true
