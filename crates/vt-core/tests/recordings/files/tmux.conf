# A status line that shows neither the host nor the time, and a shell
# that is not a login shell, which would read the system's profile and its
# prompt, with the host and the user in it: `sh-3.2$` is the shell's own.
set -g default-shell /bin/sh
set -g default-command /bin/sh
set -g status-left "[rec] "
set -g status-right "bolt"
set -g escape-time 0
