[package]
name = "lokyr-plugin-host-luau"
description = "Runs third-party Lokyr plugins written in Luau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# A helper of the tests of other crates, which make each request of the
# plugin API through Luau.
testing = []

[dependencies]
lokyr-plugin-sdk = { workspace = true, features = ["unstable"] }
mlua.workspace = true
serde.workspace = true

[dev-dependencies]
lokyr-plugin-sdk = { workspace = true, features = ["fake"] }

[lints]
workspace = true
