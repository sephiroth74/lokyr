[package]
name = "bolt-app"
description = "The Bolt terminal emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bolt"
path = "src/main.rs"

[features]
default = ["luau-plugins"]
# Support for third-party plugins written in Luau.
luau-plugins = ["dep:bolt-plugin-host-luau"]

[dependencies]
bolt-core-actions.workspace = true
bolt-kernel.workspace = true
bolt-platform-core.workspace = true
bolt-plugin-host-luau = { workspace = true, optional = true }
bolt-pty.workspace = true
bolt-render-core.workspace = true
bolt-session.workspace = true
bolt-text-core.workspace = true
bolt-ui-core.workspace = true
bolt-vt-core.workspace = true
notify.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
bolt-font-coretext.workspace = true
bolt-platform-macos.workspace = true
bolt-render-metal.workspace = true

[dev-dependencies]
bolt-platform-core = { workspace = true, features = ["fake"] }

[lints]
workspace = true
