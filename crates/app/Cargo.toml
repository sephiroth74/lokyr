[package]
name = "lokyr-app"
description = "The Lokyr terminal emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "lokyr"
path = "src/main.rs"

[features]
default = ["luau-plugins"]
# Support for third-party plugins written in Luau.
luau-plugins = ["dep:lokyr-plugin-host-luau"]

[dependencies]
lokyr-core-actions.workspace = true
lokyr-kernel.workspace = true
lokyr-platform-core.workspace = true
lokyr-plugin-host-luau = { workspace = true, optional = true }
lokyr-pty.workspace = true
lokyr-render-core.workspace = true
lokyr-session.workspace = true
lokyr-text-core.workspace = true
lokyr-ui-core.workspace = true
lokyr-vt-core.workspace = true
notify.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
lokyr-font-coretext.workspace = true
lokyr-platform-macos.workspace = true
lokyr-render-metal.workspace = true

[dev-dependencies]
lokyr-platform-core = { workspace = true, features = ["fake"] }

[lints]
workspace = true
