[package]
name = "lokyr-font-coretext"
description = "CoreText font backend for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
lokyr-text-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "NSFont",
    "NSFontDescriptor",
] }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFArray",
    "CFAttributedString",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFPreferences",
    "CFPropertyList",
    "CFSet",
    "CFString",
] }
objc2-core-graphics = { workspace = true, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGFont",
    "CGImage",
    "CGPath",
] }
objc2-core-text = { workspace = true, features = [
    "std",
    "objc2-core-graphics",
    "CTFont",
    "CTFontCollection",
    "CTFontDescriptor",
    "CTFontTraits",
    "CTLine",
    "CTRun",
    "CTStringAttributes",
] }

[lints]
workspace = true
