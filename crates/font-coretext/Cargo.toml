[package]
name = "bolt-font-coretext"
description = "CoreText font backend for macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
bolt-text-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "objc2-core-foundation",
    "NSFont",
    "NSFontDescriptor",
] }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFSet",
    "CFString",
] }
objc2-core-graphics = { workspace = true, features = ["std", "CGFont"] }
objc2-core-text = { workspace = true, features = [
    "std",
    "objc2-core-graphics",
    "CTFont",
    "CTFontDescriptor",
    "CTFontTraits",
] }
objc2-foundation = { workspace = true, features = ["std", "NSString"] }

[lints]
workspace = true
