[toolchain]
# Pinned on purpose: bump it in a dedicated commit, never as a side effect.
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
# Lokyr runs on Apple Silicon only, so aarch64-apple-darwin is the only macOS
# target. x86_64-unknown-linux-gnu lets us `cargo check` the
# platform-independent crates for Linux from macOS.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
