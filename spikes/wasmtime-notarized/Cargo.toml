[package]
name = "spike"
description = "Throwaway spike: a signed, notarized AppKit app that hosts WebAssembly components"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# Run guests on Pulley, wasmtime's interpreter, instead of native code
# generated by Cranelift. Pulley needs no executable memory, hence no JIT
# entitlement under the hardened runtime.
pulley = ["wasmtime/pulley"]
# Lua runtimes, for the comparison with WebAssembly plugins. Enable at most one.
luajit = ["dep:mlua", "mlua/luajit", "mlua/vendored"]
luau = ["dep:mlua", "mlua/luau", "mlua/vendored"]
# Luau with its native code generator, its JIT.
luau-jit = ["luau", "mlua/luau-jit"]

[dependencies]
libc = "0.2.190"
mlua = { version = "0.12.2", optional = true }
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
spike-workload = { path = "workload" }
# 48 is the current LTS line.
wasmtime = "48.0.5"

# The spike is its own small workspace: the macOS host and the Wasm guest.
[workspace]
members = ["guest", "workload"]

[profile.release]
debug = "line-tables-only"

# A plugin ships without debug info or symbols.
[profile.release.package.spike-guest]
debug = false
strip = true
