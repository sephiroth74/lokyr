name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA; the comment after each one names its tag.
# Every job runs the same `just` recipes used locally.
jobs:
  macos:
    # Only the checks that need macOS run here, because macOS runners are the
    # most expensive ones.
    name: macos
    # The oldest macOS that Lokyr supports, pinned so that the job does not
    # move along with macos-latest.
    runs-on: macos-26
    # A run takes 3 to 4 minutes; GitHub bills a macOS runner's minute as
    # ten of the account's, so that a test that hangs costs no more than
    # this.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0
      # The renderer's shaders build with the Metal toolchain, a download
      # of its own since Xcode 26, which a runner's image may lack.
      - name: Install the Metal toolchain where the runner lacks it
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      # The golden tests draw offscreen where the runner has a Metal device,
      # and skip without one: the job says which.
      - name: Tell whether the golden tests draw
        run: |
          printf 'import Metal\nprint(MTLCreateSystemDefaultDevice()?.name ?? "")\n' > "$RUNNER_TEMP/device.swift"
          device="$(swift "$RUNNER_TEMP/device.swift" 2>/dev/null || true)"
          if [ -n "$device" ]; then
            echo "The golden tests draw on $device."
          else
            echo "::notice title=Golden tests::The runner has no Metal device, and the golden tests skip."
          fi
      - run: just clippy
      - run: just build
      - run: just test
        timeout-minutes: 5
      # Signed ad hoc, as the runner has no Developer ID.
      - run: just bundle

  linux:
    # Checks that give the same result on every platform, plus the tests of
    # the platform-independent crates and of the tools: the VT core, the PTY
    # and the session, search, the replay and recording tools, the
    # differential tests, and the tasks', as terminfo's, with Ubuntu's tic.
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0,cargo-deny@0.20.2
      - run: just fmt-check
      - run: just check-deps
      - run: just check-comments
      - run: just check-links
      - run: just deny
      - run: just test-portable

  instructions:
    # The instructions that the VT core takes for vtebench's scenarios, for
    # kitty's tests of CSI sequences and of unique clusters, and for text as
    # `cat` prints it, which callgrind counts on Linux, against those of the
    # commit that the push or the pull request starts from: a rise of more
    # than 3% fails.
    name: instructions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit to compare with.
          fetch-depth: 0
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - name: Count the instructions against the base commit's
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just instructions "$BASE"
