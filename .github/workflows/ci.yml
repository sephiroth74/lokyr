name: CI

on:
  push:
    # A phase's branch too, whose pushes run the Linux jobs alone: the
    # macOS job runs on main's, as the next job tells.
    branches: [main, f3]
  pull_request:
  # Every job, the macOS one too, of any branch, as `gh workflow run CI
  # --ref f3` asks.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run,
# but on main, whose every run goes to its end, so that no push of code
# goes untested on macOS; a run asked by hand is a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA; the comment after each one names its tag.
# Every job runs the same `just` recipes used locally.
jobs:
  changes:
    # Whether the push or the pull request changes more than documents,
    # Markdown files and docs/, which the macOS job needs to check: of a
    # push to main, since the last commit whose macOS job passed, so that a
    # push of documents after one of code whose job failed, or did not
    # run, checks it again.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEW_BRANCH: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          RUN: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        # A run asked by hand, a branch's first push, a forced one, a base
        # that the history lacks, or a push to main of no passed macOS job
        # among the last runs, checks everything. Renames count as two
        # paths, so that a file moved into docs/ counts its old place.
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            passed=""
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=30" \
              --jq ".workflow_runs[] | select(.id != $RUN) | \"\(.id) \(.head_sha)\"")" || runs=""
            while read -r id sha; do
              [ -n "$id" ] || continue
              job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '.jobs[] | select(.name == "macos") | .conclusion')" || job=""
              if [ "$job" = success ]; then
                passed="$sha"
                break
              fi
            done <<< "$runs"
            BASE="$passed"
          fi
          code=true
          if [ "$EVENT" != workflow_dispatch ] && [ "$NEW_BRANCH" != true ] && [ "$FORCED" != true ] \
            && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && ! git diff --no-renames --name-only "$BASE" HEAD | grep -qvE '^docs/|\.md$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  macos:
    # Only the checks that need macOS run here, because macOS runners are the
    # most expensive ones: GitHub bills a macOS runner's minute as ten of the
    # account's. So the job runs on main's pushes, on pull requests and on
    # the runs asked by hand, of changes beyond documents; a phase's branch,
    # as f3, runs it by hand, `just ci` running its checks on the Mac before
    # each push.
    name: macos
    needs: changes
    # Of a `changes` job that failed too, which would leave the code
    # unchecked, as a required check takes a skipped job as passed.
    if: >-
      !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
      && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    # The oldest macOS that Lokyr supports, pinned so that the job does not
    # move along with macos-latest.
    runs-on: macos-26
    # A run takes 3 to 4 minutes with its cache; a run without it builds
    # everything, which takes longer, and must end to save one, as a job
    # that times out saves none.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0
      # The renderer's shaders build with the Metal toolchain, a download
      # of its own since Xcode 26, which a runner's image may lack.
      - name: Install the Metal toolchain where the runner lacks it
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      # The golden tests draw offscreen where the runner has a Metal device,
      # and skip without one: the job says which.
      - name: Tell whether the golden tests draw
        run: |
          printf 'import Metal\nprint(MTLCreateSystemDefaultDevice()?.name ?? "")\n' > "$RUNNER_TEMP/device.swift"
          device="$(swift "$RUNNER_TEMP/device.swift" 2>/dev/null || true)"
          if [ -n "$device" ]; then
            echo "The golden tests draw on $device."
          else
            echo "::notice title=Golden tests::The runner has no Metal device, and the golden tests skip."
          fi
      - run: just clippy
      - run: just build
      - run: just build-minimal
      - run: just test
        timeout-minutes: 8
      # Signed ad hoc, as the runner has no Developer ID.
      - run: just bundle

  linux:
    # Checks that give the same result on every platform, plus the tests of
    # the platform-independent crates and of the tools: the VT core, the PTY
    # and the session, search, the replay and recording tools, the
    # differential tests, and the tasks', as terminfo's, with Ubuntu's tic.
    name: linux
    runs-on: ubuntu-latest
    # About 3 minutes with its cache; a run without it builds everything,
    # and must end to save one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0,cargo-deny@0.20.2
      - run: just fmt-check
      - run: just check-deps
      - run: just check-comments
      - run: just check-links
      - run: just check-config-guide
      - run: just check-dist
      - run: just deny
      - run: just test-portable

  instructions:
    # The instructions that the VT core takes for vtebench's scenarios, for
    # kitty's tests of CSI sequences and of unique clusters, and for text as
    # `cat` prints it, which callgrind counts on Linux, against those of the
    # commit that the push or the pull request starts from: a rise of more
    # than 3% fails.
    name: instructions
    runs-on: ubuntu-latest
    # About 4 minutes with its cache; Valgrind's install from apt alone
    # took 10 once, and the counts take two builds.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit to compare with.
          fetch-depth: 0
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - name: Count the instructions against the base commit's
        env:
          # A branch's first push, which has no commit before it, and a
          # forced one, whose commit before no ref reaches, against main.
          BASE: ${{ github.event.pull_request.base.sha || ((github.event.created || github.event.forced) && 'origin/main') || github.event.before }}
        run: just instructions "$BASE"
