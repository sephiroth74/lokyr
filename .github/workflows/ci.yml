name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA; the comment after each one names its tag.
# Every job runs the same `just` recipes used locally.
jobs:
  macos:
    # Only the checks that need macOS run here, because macOS runners are the
    # most expensive ones.
    name: macos
    # The oldest macOS that Bolt supports, pinned so that the job does not
    # move along with macos-latest.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0
      - run: just clippy
      - run: just build
      - run: just test

  linux:
    # Checks that give the same result on every platform, plus the tests of
    # the platform-independent crates and of the tools: the VT core, the PTY
    # and the session, search, the replay and recording tools, the
    # differential tests, and the tasks', as terminfo's, with Ubuntu's tic.
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0,cargo-deny@0.20.2
      - run: just fmt-check
      - run: just check-deps
      - run: just deny
      - run: just test-portable

  instructions:
    # The instructions that the VT core takes for vtebench's scenarios and
    # for text as `cat` prints it, which callgrind counts on Linux, against
    # those of the commit that the push or the pull request starts from: a
    # rise of more than 3% fails.
    name: instructions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit to compare with.
          fetch-depth: 0
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - name: Count the instructions against the base commit's
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just instructions "$BASE"
