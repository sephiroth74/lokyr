[workspace]
resolver = "3"
# Cargo rejects member globs that match no directory, so a glob is added
# only once its directory exists.
members = ["crates/*", "sleip/*", "plugins/*", "tools/*"]
# Spikes are throwaway experiments with their own manifests, and the fuzz
# targets build only with nightly.
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Alessandro Crugnola <alessandro.crugnola@gmail.com>"]
repository = "https://github.com/sephiroth74/lokyr"

[workspace.dependencies]
anyhow = "1.0.104"
# The terminal core that the differential tests compare vt-core against, without
# serde, which they do not need.
alacritty_terminal = { version = "0.26.0", default-features = false }
cargo_metadata = "0.23.1"
# Benchmarks, without plots or rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The catalogs of the texts that Lokyr shows, in Project Fluent's format, and
# their parser, for the tests that compare them.
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
# Instruction counts under callgrind, in the Linux job. Its runner,
# gungraun-runner, must have the version that Cargo.lock holds.
gungraun = "0.20.0"
# Golden snapshots of the screen, from recorded sessions.
insta = { version = "1.49.0", default-features = false }
libc = "0.2.190"
# Literal search over the grid's text.
memchr = "2.8.3"
# The golden images of the renderer's tests.
png = "0.18.1"
# Regex search over the grid's text.
regex = "1.13.1"
regex-automata = "0.4.18"
# objc2 crates move together, with block2: keep their versions aligned. Each
# member enables the classes and functions that it uses.
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-text = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
objc2-user-notifications = { version = "0.3.2", default-features = false }
# Without forking and timeouts, which the tests do not use.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# What a platform hands a renderer of a window: on the Mac, its content view.
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
# The config's watcher, on FSEvents on macOS and inotify on Linux.
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
# The config's reader, which keeps the place of each key and value.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
unicode-normalization = "0.1.25"
# The language tags of the catalogs.
unic-langid = "0.9.6"
# The reference parser that tests compare vt-core against.
vte = "0.15.0"

# Internal crates
sleip-index = { path = "sleip/index" }
sleip-resolver = { path = "sleip/resolver" }
lokyr-core-actions = { path = "plugins/core-actions" }
lokyr-font-coretext = { path = "crates/font-coretext" }
lokyr-kernel = { path = "crates/kernel" }
lokyr-links = { path = "plugins/links" }
lokyr-pkg-model = { path = "crates/pkg-model" }
lokyr-platform-core = { path = "crates/platform-core" }
lokyr-platform-macos = { path = "crates/platform-macos" }
lokyr-plugin-host-luau = { path = "crates/plugin-host-luau" }
lokyr-plugin-sdk = { path = "crates/plugin-sdk" }
lokyr-pty = { path = "crates/pty" }
lokyr-render-core = { path = "crates/render-core" }
lokyr-render-metal = { path = "crates/render-metal" }
lokyr-replay = { path = "tools/replay" }
lokyr-search = { path = "crates/search" }
lokyr-session = { path = "crates/session" }
lokyr-text-core = { path = "crates/text-core" }
lokyr-ui-core = { path = "crates/ui-core" }
lokyr-vt-core = { path = "crates/vt-core" }

# Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
# A short list of pedantic lints that catch real mistakes with little noise.
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
# Explicit because native plugins are isolated with `catch_unwind`, which
# only works when panics unwind.
panic = "unwind"
debug = "line-tables-only"

# Release build with full debug info, for Instruments and other profilers.
[profile.profiling]
inherits = "release"
debug = true
