[workspace]
resolver = "3"
# Cargo rejects member globs that match no directory, so a glob is added
# only once its directory exists.
members = ["crates/*", "faretra/*", "plugins/*", "tools/*"]
# Spikes are throwaway experiments with their own manifests.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Alessandro Crugnola <alessandro.crugnola@gmail.com>"]
repository = "https://github.com/sephiroth74/saetta"

[workspace.dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
libc = "0.2.190"
# objc2 crates move together: keep their versions aligned.
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
# The reference parser that tests compare vt-core against.
vte = "0.15.0"

# Internal crates
faretra-index = { path = "faretra/index" }
faretra-resolver = { path = "faretra/resolver" }
saetta-core-actions = { path = "plugins/core-actions" }
saetta-font-coretext = { path = "crates/font-coretext" }
saetta-kernel = { path = "crates/kernel" }
saetta-pkg-model = { path = "crates/pkg-model" }
saetta-platform-core = { path = "crates/platform-core" }
saetta-platform-macos = { path = "crates/platform-macos" }
saetta-plugin-host-luau = { path = "crates/plugin-host-luau" }
saetta-plugin-sdk = { path = "crates/plugin-sdk" }
saetta-pty = { path = "crates/pty" }
saetta-render-core = { path = "crates/render-core" }
saetta-render-metal = { path = "crates/render-metal" }
saetta-search = { path = "crates/search" }
saetta-session = { path = "crates/session" }
saetta-text-core = { path = "crates/text-core" }
saetta-ui-core = { path = "crates/ui-core" }
saetta-vt-core = { path = "crates/vt-core" }

# Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
# A short list of pedantic lints that catch real mistakes with little noise.
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
# Explicit because native plugins are isolated with `catch_unwind`, which
# only works when panics unwind.
panic = "unwind"
debug = "line-tables-only"

# Release build with full debug info, for Instruments and other profilers.
[profile.profiling]
inherits = "release"
debug = true
