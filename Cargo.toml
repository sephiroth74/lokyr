[workspace]
resolver = "3"
# Cargo rejects member globs that match no directory, so a glob is added
# only once its directory exists.
members = ["crates/*", "crossbow/*", "plugins/*", "tools/*"]
# Spikes are throwaway experiments with their own manifests, and the fuzz
# targets build only with nightly.
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Alessandro Crugnola <alessandro.crugnola@gmail.com>"]
repository = "https://github.com/sephiroth74/bolt"

[workspace.dependencies]
anyhow = "1.0.104"
# The terminal core that the differential tests compare vt-core against, without
# serde, which they do not need.
alacritty_terminal = { version = "0.26.0", default-features = false }
cargo_metadata = "0.23.1"
# Benchmarks, without plots or rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Instruction counts under callgrind, in the Linux job. Its runner,
# gungraun-runner, must have the version that Cargo.lock holds.
gungraun = "0.20.0"
# Golden snapshots of the screen, from recorded sessions.
insta = { version = "1.49.0", default-features = false }
libc = "0.2.190"
# Literal search over the grid's text.
memchr = "2.8.3"
# Regex search over the grid's text.
regex-automata = "0.4.18"
# objc2 crates move together: keep their versions aligned.
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
# Without forking and timeouts, which the tests do not use.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
unicode-normalization = "0.1.25"
# The reference parser that tests compare vt-core against.
vte = "0.15.0"

# Internal crates
crossbow-index = { path = "crossbow/index" }
crossbow-resolver = { path = "crossbow/resolver" }
bolt-core-actions = { path = "plugins/core-actions" }
bolt-font-coretext = { path = "crates/font-coretext" }
bolt-kernel = { path = "crates/kernel" }
bolt-pkg-model = { path = "crates/pkg-model" }
bolt-platform-core = { path = "crates/platform-core" }
bolt-platform-macos = { path = "crates/platform-macos" }
bolt-plugin-host-luau = { path = "crates/plugin-host-luau" }
bolt-plugin-sdk = { path = "crates/plugin-sdk" }
bolt-pty = { path = "crates/pty" }
bolt-render-core = { path = "crates/render-core" }
bolt-render-metal = { path = "crates/render-metal" }
bolt-replay = { path = "tools/replay" }
bolt-search = { path = "crates/search" }
bolt-session = { path = "crates/session" }
bolt-text-core = { path = "crates/text-core" }
bolt-ui-core = { path = "crates/ui-core" }
bolt-vt-core = { path = "crates/vt-core" }

# Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
# A short list of pedantic lints that catch real mistakes with little noise.
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
# Explicit because native plugins are isolated with `catch_unwind`, which
# only works when panics unwind.
panic = "unwind"
debug = "line-tables-only"

# Release build with full debug info, for Instruments and other profilers.
[profile.profiling]
inherits = "release"
debug = true
