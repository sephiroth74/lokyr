# kitty's base config for the sessions: Menlo at 13 points, 120 × 40 cells, no
# ligatures, a cursor that doesn't blink, an opaque window, no shell
# integration, 10 000 rows of scrollback. Its defaults that the measures
# depend on: input_delay 3, repaint_delay 10, sync_to_monitor yes.
font_family Menlo
font_size 13
disable_ligatures always
initial_window_width 120c
initial_window_height 40c
remember_window_size no
cursor_blink_interval 0
scrollback_lines 10000
background_opacity 1
shell_integration disabled
confirm_os_window_close 0
macos_quit_when_last_window_closed yes
