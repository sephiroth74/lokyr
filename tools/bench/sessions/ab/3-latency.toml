# A release's A/B, step 3 of 6, about 7 minutes: 100 keys of each copy in
# each of eight cycles, at every phase of the refresh, after four launches
# of each that settle the Mac first. A run's keys move together of the
# machine's state, as another program's work raises the processor's
# clocks: eight runs a copy, interleaved, meet its states alike. The budgets are of a display at 60 Hz: 2
# refreshes at the median, 4.5 at the 99th percentile. Leave the Mac alone
# before the step starts: a Mac in use echoes keys some milliseconds
# sooner than one at rest, which would split the cycles.
terminals = ["lokyr-a", "lokyr-b"]
terminals-file = "../terminals.toml"
ab = { a = "lokyr-a", b = "lokyr-b" }
pause = 2
cycles = 8
season = 4
folder = "/tmp/lokyr/ttybench/sessions/ab-3-latency-{date}"

[[run]]
tool = "latency"
args = ["--keys", "100"]
rounds = 1

[[budget]]
metric = "latency_ms"
at-most = 33.3

[[budget]]
metric = "latency_ms"
stat = "p99"
at-most = 75
