# A release's A/B, step 1 of 6, about 9 minutes: the startup, each copy
# and the floor app launched 30 times first, the floor beside each round,
# and the memory at rest.
terminals = ["lokyr-a", "lokyr-b"]
terminals-file = "../terminals.toml"
ab = { a = "lokyr-a", b = "lokyr-b" }
pause = 2
cycles = 4
season = 30
folder = "/tmp/lokyr/ttybench/sessions/ab-1-start-{date}"

[[run]]
tool = "startup"
rounds = 8
args = ["--floor"]

[[run]]
tool = "memory"
rounds = 2
