<!doctype html>
<!-- The site's social image, 1200 × 630, that `just og-image` draws into
     site/public/og.png: the icon, the name and the tagline over the home's
     backdrop, in its colors and fonts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Lokyr Y";
    src: url("../public/lokyr-y.woff2") format("woff2");
    font-weight: 400;
    unicode-range: U+79;
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #0b0911;
    color: #f4f1ff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(600px 460px at 26% 30%, rgba(165, 146, 255, 0.26), transparent 70%),
      radial-gradient(520px 380px at 82% 88%, rgba(242, 122, 196, 0.14), transparent 70%);
  }
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(244, 241, 255, 0.08) 1.2px, transparent 1.5px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(ellipse 75% 80% at 30% 40%, #000 30%, transparent 80%);
  }
  .card {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 96px;
  }
  .mark { width: 300px; height: 300px; flex: none; overflow: visible; }
  h1 {
    margin: 0;
    font-size: 148px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.045em;
    padding-bottom: 0.25em;
    margin-bottom: -0.25em;
    background: linear-gradient(180deg, #fff 30%, #c9bfff 100%);
    -webkit-background-clip: text;
    color: transparent;
  }
  .y { font-family: "Lokyr Y", Georgia, serif; font-weight: 400; margin-inline: 0.04em; }
  .tagline {
    margin: 22px 0 0;
    max-width: 640px;
    font-size: 38px;
    line-height: 1.3;
    font-weight: 500;
    color: #c4bedb;
    letter-spacing: -0.01em;
  }
  .tagline strong { color: #f4f1ff; font-weight: 600; }
  .facts {
    margin: 30px 0 0;
    font: 24px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: #8f88aa;
  }
  .facts b {
    font-weight: 400;
    background: linear-gradient(120deg, #a592ff, #f27ac4);
    -webkit-background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="dots"></div>
<div class="card">
  <svg class="mark" viewBox="200 200 624 624" aria-hidden="true">
    <defs>
      <linearGradient id="ring" x1="242" y1="242" x2="782" y2="782" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#A592FF"/>
        <stop offset="1" stop-color="#F27AC4"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="30"/>
      </filter>
    </defs>
    <path d="M685.6 305.2 A270 270 0 1 1 613.1 261.7" fill="none" stroke="url(#ring)" stroke-width="70" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>
    <path d="M685.6 305.2 A270 270 0 1 1 613.1 261.7" fill="none" stroke="url(#ring)" stroke-width="70" stroke-linecap="round"/>
    <circle cx="685.6" cy="305.2" r="50" fill="url(#ring)"/>
    <circle cx="679" cy="285" r="9" fill="#0b0911"/>
    <path d="M430 450 L500 512 L430 574" fill="none" stroke="#F4F1FF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="525" y="552" width="90" height="40" rx="9" fill="#F4F1FF"/>
  </svg>
  <div>
    <h1>Lok<span class="y">y</span>r</h1>
    <p class="tagline">A fast terminal for macOS, where <strong>every feature is a plugin</strong>.</p>
    <p class="facts">Rust · Metal · open source · <b>lokyr.dev</b></p>
  </div>
</div>
</body>
</html>
