# The default distribution: the first-party plugins that the app's build
# holds, in the order of their activation, as the app's later plugins' keys
# take a key before the earlier ones'. `cargo xtask gen-dist` makes the
# app's features and registrations of every distribution, `dist-<name>`.
[distribution]
name = "default"

[plugins]
# The system's default shortcuts first, which the plugins' own keys after
# them win over.
keymap-macos = { path = "../plugins/keymap-macos", target = "macos" }
core-actions = { path = "../plugins/core-actions" }
links = { path = "../plugins/links" }
tabs = { path = "../plugins/tabs" }
splits = { path = "../plugins/splits" }
search = { path = "../plugins/search" }
command-palette = { path = "../plugins/command-palette" }
quick-terminal = { path = "../plugins/quick-terminal" }
progress = { path = "../plugins/progress" }
command-header = { path = "../plugins/command-header" }
